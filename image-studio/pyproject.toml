[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-studio"
version = "0.1.0"
description = "Analyse, enhance and unify photos so a whole set looks like one shoot - library, CLI, HTTP API and web component."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.3",
  "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
ai = ["rembg>=2.0.57", "onnxruntime>=1.17"]
server = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
image-studio = "image_studio.cli:main"

[tool.setuptools]
packages = ["image_studio"]

[tool.setuptools.package-data]
image_studio = ["presets/*.json", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
