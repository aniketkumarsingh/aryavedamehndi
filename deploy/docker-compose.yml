# Production stack: Postgres, a one-off migration, the API, the background
# worker, the website and Caddy (HTTPS with automatic certificates).
#
# Normally deployed by CI (.github/workflows/deploy.yml): images are built
# once, pushed to GHCR (BACKEND_IMAGE / WEB_IMAGE in .env) and started on the
# server by deploy.sh <tag>, which smoke-tests and rolls back on failure.
# Building on the server instead:
#
#   cd deploy
#   cp .env.example .env        # fill it in
#   IMAGE_TAG=$(git rev-parse --short HEAD) docker compose up -d --build
#
# Every long-running service restarts on failure and has a health check;
# the API and worker wait for migrations to finish before starting.

name: aryaveda

x-backend: &backend
  build:
    context: ../backend
    args:
      GIT_SHA: ${IMAGE_TAG:-${GIT_SHA:-dev}}
  image: ${BACKEND_IMAGE:-aryaveda-backend}:${IMAGE_TAG:-${GIT_SHA:-dev}}
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    GIT_SHA: ${IMAGE_TAG:-${GIT_SHA:-dev}}
    LOG_FORMAT: ${LOG_FORMAT:-json}
  volumes:
    - media:/app/media
    - backups:/app/backups
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *backend
    # --proxy-headers: trust X-Forwarded-For from Caddy so rate limits see
    # the visitor's IP. Safe because the API port isn't published.
    # --no-access-log: the app writes its own JSON access lines (request id,
    # user, order, duration) - see app/core/logging.py.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--proxy-headers", "--forwarded-allow-ips", "*", "--no-access-log"]
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 60s
    healthcheck:
      # Healthy while the worker keeps finishing jobs (see /health/ready).
      test: ["CMD", "python", "-c", "import sys; from app.services.health import readiness; r = readiness(); sys.exit(1 if any('worker' in p for p in r['problems']) else 0)"]
      interval: 60s
      timeout: 20s
      start_period: 120s
      retries: 3
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: ../frontend
      args:
        API_BASE_INTERNAL: http://api:8000
        NEXT_PUBLIC_API_BASE: https://${API_DOMAIN}
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
        NEXT_PUBLIC_GIT_SHA: ${IMAGE_TAG:-${GIT_SHA:-dev}}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_BUSINESS_LEGAL_NAME: ${BUSINESS_LEGAL_NAME:-}
        NEXT_PUBLIC_BUSINESS_ADDRESS: ${BUSINESS_ADDRESS:-}
        NEXT_PUBLIC_BUSINESS_STATE: ${BUSINESS_STATE:-}
        NEXT_PUBLIC_BUSINESS_GSTIN: ${BUSINESS_GSTIN:-}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
        NEXT_PUBLIC_SUPPORT_PHONE: ${SUPPORT_PHONE:-}
        NEXT_PUBLIC_SUPPORT_WHATSAPP: ${SUPPORT_WHATSAPP:-}
        NEXT_PUBLIC_GRIEVANCE_OFFICER_NAME: ${GRIEVANCE_OFFICER_NAME:-}
        NEXT_PUBLIC_GRIEVANCE_OFFICER_EMAIL: ${GRIEVANCE_OFFICER_EMAIL:-}
        NEXT_PUBLIC_GRIEVANCE_OFFICER_PHONE: ${GRIEVANCE_OFFICER_PHONE:-}
    image: ${WEB_IMAGE:-aryaveda-web}:${IMAGE_TAG:-${GIT_SHA:-dev}}
    restart: unless-stopped
    environment:
      API_BASE_INTERNAL: http://api:8000
    depends_on:
      api: { condition: service_healthy }
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      APEX_DOMAIN: ${APEX_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    logging: *logging

volumes:
  pgdata:
  media:
  backups:
  caddy_data:
  caddy_config:
