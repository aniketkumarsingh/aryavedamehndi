name: Images

# Builds the backend and website images once and pushes them to GHCR as
# ghcr.io/<owner>/aryavedamehndi-backend:<tag> and ...-web:<tag>. The website
# image bakes in the environment's public settings (NEXT_PUBLIC_*).

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      environment:
        type: string
        required: true
      also_latest:
        type: boolean
        default: false
    outputs:
      tag:
        value: ${{ jobs.build.outputs.tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.names.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: names
        name: Image names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="${{ inputs.tag }}"
          tag="${tag:0:40}"
          echo "backend=ghcr.io/${owner}/aryavedamehndi-backend" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${owner}/aryavedamehndi-web" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          build-args: GIT_SHA=${{ steps.names.outputs.tag }}
          tags: |
            ${{ steps.names.outputs.backend }}:${{ steps.names.outputs.tag }}
            ${{ inputs.also_latest && format('{0}:latest', steps.names.outputs.backend) || '' }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Website image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            API_BASE_INTERNAL=http://api:8000
            NEXT_PUBLIC_API_BASE=https://${{ vars.API_DOMAIN }}
            NEXT_PUBLIC_SITE_URL=https://${{ vars.SITE_DOMAIN }}
            NEXT_PUBLIC_GIT_SHA=${{ steps.names.outputs.tag }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
            NEXT_PUBLIC_META_PIXEL_ID=${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_BUSINESS_LEGAL_NAME=${{ vars.BUSINESS_LEGAL_NAME }}
            NEXT_PUBLIC_BUSINESS_ADDRESS=${{ vars.BUSINESS_ADDRESS }}
            NEXT_PUBLIC_BUSINESS_STATE=${{ vars.BUSINESS_STATE }}
            NEXT_PUBLIC_BUSINESS_GSTIN=${{ vars.BUSINESS_GSTIN }}
            NEXT_PUBLIC_SUPPORT_EMAIL=${{ vars.SUPPORT_EMAIL }}
            NEXT_PUBLIC_SUPPORT_PHONE=${{ vars.SUPPORT_PHONE }}
            NEXT_PUBLIC_SUPPORT_WHATSAPP=${{ vars.SUPPORT_WHATSAPP }}
            NEXT_PUBLIC_GRIEVANCE_OFFICER_NAME=${{ vars.GRIEVANCE_OFFICER_NAME }}
            NEXT_PUBLIC_GRIEVANCE_OFFICER_EMAIL=${{ vars.GRIEVANCE_OFFICER_EMAIL }}
            NEXT_PUBLIC_GRIEVANCE_OFFICER_PHONE=${{ vars.GRIEVANCE_OFFICER_PHONE }}
          tags: |
            ${{ steps.names.outputs.web }}:${{ steps.names.outputs.tag }}
            ${{ inputs.also_latest && format('{0}:latest', steps.names.outputs.web) || '' }}
          cache-from: type=gha,scope=web-${{ inputs.environment }}
          cache-to: type=gha,scope=web-${{ inputs.environment }},mode=max

      - name: Summary
        run: |
          echo "### Images" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.names.outputs.backend }}:${{ steps.names.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.names.outputs.web }}:${{ steps.names.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
